[project]
name = "hasdata-instagram-mcp"
version = "1.0.1"
description = "MCP server for public Instagram data through HasData's hosted API. Reads public data only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "instagram", "profile", "posts", "model-context-protocol", "hasdata"]
# mcp is pinned below 2 because mcp-proxy 0.12.0 imports request_ctx, removed in the mcp 2.x SDK.
dependencies = ["mcp-proxy>=0.12.0", "mcp>=1.17,<2"]

[project.urls]
Homepage = "https://hasdata.com/apis/instagram-profile-api"
Repository = "https://github.com/HasData/instagram-mcp"

[project.scripts]
hasdata-instagram-mcp = "hasdata_instagram_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hasdata_instagram_mcp"]
